# Apphive (SL) Limited status page: https://status.apphivesl.com
# Design and rules: RFC 013 (docs/rfc/013-public-status-page-and-service-levels.md in sms_core).
# Never name a provider, carrier, route or gateway here: component names and incident text are public.
owner: ApphiveSL
repo: status_page

# Phase 1: external checks from GitHub Actions every 5 minutes.
# Phase 2 adds "SMS delivery", "OTP delivery", "Bulk messaging" and "SMPP" from
# https://api.apphivesl.com/status/summary (measured from clients' real traffic).
sites:
  - name: SMS API
    slug: sms-api
    icon: https://apphivesl.com/assets/images/logo.png
    url: https://api.apphivesl.com/health
    expectedStatusCodes: [200]
    maxResponseTime: 5000
  - name: Customer portal
    slug: customer-portal
    icon: https://apphivesl.com/assets/images/logo.png
    url: https://sms.apphivesl.com/health
    expectedStatusCodes: [200]
    maxResponseTime: 5000
  - name: AI connector
    slug: ai-connector
    icon: https://apphivesl.com/assets/images/logo.png
    url: https://mcp.apphivesl.com/health
    expectedStatusCodes: [200]
    maxResponseTime: 5000
  - name: Website
    slug: website
    icon: https://apphivesl.com/assets/images/logo.png
    url: https://apphivesl.com
    expectedStatusCodes: [200]
    maxResponseTime: 8000

status-website:
  cname: status.apphivesl.com
  # GitHub API reads go through our cached proxy (proxy/), so visitors never hit GitHub's per-IP limit.
  apiBaseUrl: https://apphive-status-proxy.apptell-sl.workers.dev
  logoUrl: https://apphivesl.com/assets/images/logo.png
  logoHref: https://status.apphivesl.com
  favicon: https://apphivesl.com/assets/images/logo.png
  name: Apphive
  introTitle: Service status
  introMessage: Live status of the Apphive SMS platform, checked automatically every 5 minutes from outside our network. Incidents open and close on their own when a check fails or recovers.
  theme: light
  customHeadHtml: "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\"><meta name=\"theme-color\" content=\"#09090b\"><script>try{if(localStorage.getItem('theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>"
  customBodyHtml: "<script>(function(){var sun='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/></svg>',moon='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"/></svg>';\nfunction light(){return document.documentElement.getAttribute('data-theme')==='light'}\nfunction paint(b){b.innerHTML=light()?moon:sun;b.setAttribute('aria-label',light()?'Switch to dark mode':'Switch to light mode')}\nfunction add(){var ul=document.querySelector('nav ul');if(!ul||document.getElementById('ah-theme'))return;var b=document.createElement('button');b.id='ah-theme';b.type='button';paint(b);\nb.onclick=function(){var t=light()?'dark':'light';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('theme',t)}catch(e){}paint(b)};ul.parentNode.appendChild(b)}\nadd();new MutationObserver(add).observe(document.body,{childList:true,subtree:true})})();</script><script>(function(){function stale(){var t=document.body&&document.body.innerText||'';return /dynamically imported module|Importing a module script failed/.test(t)}function check(){if(!stale())return;try{var last=+sessionStorage.getItem('ah-reloaded')||0;if(Date.now()-last<60000)return;sessionStorage.setItem('ah-reloaded',String(Date.now()))}catch(e){return}location.reload()}new MutationObserver(check).observe(document.documentElement,{childList:true,subtree:true})})();</script>"
  css: |
    /* Apphive look: tokens copied from apphivesl.com styles.css (dark default, light via toggle). */
    :root{--primary:#f97316;--primary-dark:#ea6c0a;--ok:#22c55e;--bad:#ef4444;--warn:#eab308;
    --bg-body:#09090b;--bg-glass:rgba(17,17,19,.85);--bg-card:rgba(255,255,255,.03);--bg-card-hover:rgba(255,255,255,.06);
    --text-main:#fafafa;--text-secondary:#a1a1aa;--text-muted:#71717a;--text-dim:#52525b;
    --border-glass:rgba(255,255,255,.06);--border-card:rgba(255,255,255,.08);--hover-tint:rgba(255,255,255,.04);
    --body-background-color:var(--bg-body);--body-text-color:var(--text-main);--card-background-color:var(--bg-card);
    --card-border-color:var(--border-card);--nav-background-color:var(--bg-glass);--nav-border-bottom-color:var(--border-glass);
    --nav-current-border-bottom-color:transparent;--up-border-left-color:var(--ok);--down-border-left-color:var(--bad);
    --degraded-border-left-color:var(--warn);--down-background-color:rgba(239,68,68,.08);--tag-color:#09090b;
    --tag-up-background-color:var(--ok);--tag-down-background-color:var(--bad);--tag-degraded-background-color:var(--warn);
    --change-background-color:rgba(249,115,22,.18);--submit-button-background-color:var(--primary);--submit-button-border-color:var(--primary);
    --error-button-background-color:var(--primary);--error-button-border-color:var(--primary);--graph-opacity:1;--graph-filter:none;
    --code-color:#fb923c;--code-background-color:rgba(249,115,22,.08);color-scheme:dark}
    html[data-theme=light]{--bg-body:#fafafa;--bg-glass:rgba(255,255,255,.9);--bg-card:#ffffff;--bg-card-hover:#ffffff;
    --text-main:#09090b;--text-secondary:#3f3f46;--text-muted:#71717a;--text-dim:#a1a1aa;
    --border-glass:rgba(0,0,0,.08);--border-card:rgba(0,0,0,.06);--hover-tint:rgba(249,115,22,.06);--tag-color:#ffffff;
    --down-background-color:#fef2f2;color-scheme:light}
    html,body{background:var(--bg-body)}
    body,button,input{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    body{color:var(--text-main);line-height:1.6;-webkit-font-smoothing:antialiased}
    body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.015;background-size:128px;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
    a{color:inherit}
    p,.lead{color:var(--text-secondary)}
    .container{max-width:960px;padding:0 24px}
    /* Header bar, like the website's scrolled header */
    nav{position:sticky;top:0;z-index:10;font-weight:500!important;padding:0!important;margin-bottom:56px!important;
    backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%)}
    nav .container{min-height:64px;gap:16px}
    nav a.logo{padding:0!important;margin-right:24px!important;font-weight:700!important;font-size:1.35rem;letter-spacing:-.03em;color:var(--text-main)}
    nav a.logo img{height:32px!important;margin-right:10px!important;border-radius:0!important}
    nav ul{gap:8px}
    nav ul a{padding:6px 14px!important;border-radius:8px;font-size:.9rem;color:var(--text-muted);border-bottom:0!important;transition:color .15s,background .15s}
    nav ul a:hover,nav ul a[aria-current]{color:var(--text-main);background:var(--hover-tint)}
    html[data-theme=light] nav ul a:hover,html[data-theme=light] nav ul a[aria-current]{color:var(--primary)}
    #ah-theme{margin-left:8px;width:36px;height:36px;border-radius:8px;border:1px solid var(--border-glass);background:transparent;
    color:var(--text-muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s}
    #ah-theme:hover{background:rgba(249,115,22,.08);border-color:rgba(249,115,22,.25);color:var(--primary);transform:translateY(-1px)}
    #ah-theme svg{width:16px;height:16px}
    /* Intro */
    main>header{margin-bottom:48px}
    main>header::before{content:"Live · checked every 5 minutes";display:inline-flex;align-items:center;gap:8px;padding:6px 16px 6px 30px;
    margin-bottom:24px;border-radius:9999px;font-size:.8rem;font-weight:600;letter-spacing:.02em;color:var(--primary);
    background:rgba(249,115,22,.08) radial-gradient(circle at 16px 50%,var(--primary) 3px,transparent 3.5px) no-repeat;border:1px solid rgba(249,115,22,.15)}
    h1,h2,h3,h4{color:var(--text-main);font-weight:700}
    h1{font-size:clamp(2.25rem,5vw,3.25rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-bottom:16px}
    h2{font-size:clamp(1.4rem,3vw,1.75rem);letter-spacing:-.02em}
    h3{opacity:1;color:var(--text-muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.08em}
    .lead{font-size:1.1rem!important;max-width:620px;line-height:1.7}
    /* Status cards */
    article{border-radius:12px!important;border:1px solid var(--border-card)!important;padding:20px 24px!important;
    transition:background .3s,transform .3s,box-shadow .3s}
    article.up,article.down,article.degraded{border-left-width:3px!important}
    article.up{border-left-color:var(--ok)!important}article.down{border-left-color:var(--bad)!important}article.degraded{border-left-color:var(--warn)!important}
    article+article{margin-top:12px!important}
    article.link:hover{background-color:var(--bg-card-hover);transform:translateY(-1px)}
    html[data-theme=light] article{box-shadow:0 1px 2px rgba(0,0,0,.05)}
    html[data-theme=light] article.link:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
    article h4{font-size:1.05rem;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
    article div{color:var(--text-secondary);font-size:.9rem}
    article .data{color:var(--text-main);font-weight:600}
    article.down-active{background:var(--down-background-color)!important}
    /* Response-time graphs: Upptime draws them teal; tint to the Apphive orange behind the text */
    article.graph{background-image:none!important;position:relative;overflow:hidden;isolation:isolate}
    article.graph::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:var(--background) no-repeat right center/contain;
    filter:hue-rotate(205deg) saturate(2.4) brightness(1.15);opacity:.24}
    html[data-theme=light] article.graph::before{opacity:.22}
    article .icon{border-radius:3px}
    .tag{border-radius:9999px!important;padding:3px 10px!important;font-weight:600;font-size:.72rem!important;letter-spacing:.02em}
    /* Period switcher as a pill group */
    .f.changed{margin:48px 0 16px;gap:12px}
    .f.changed h2{margin:0}
    form.r{background:var(--bg-card);border:1px solid var(--border-card);border-radius:9999px;padding:4px}
    form.r label{margin:0!important;display:inline-block;padding:4px 14px;border-radius:9999px;font-size:.8rem;font-weight:500;color:var(--text-muted);cursor:pointer;transition:all .15s}
    form.r input:checked+label{font-weight:600!important;color:#fff;background:var(--primary)}
    /* Footer */
    footer{opacity:1!important;margin-top:80px!important;padding:32px 24px 0;border-top:1px solid var(--border-glass);color:var(--text-dim);font-size:.85rem}
    footer a{color:var(--text-muted);text-decoration:none}footer a:hover{color:var(--primary)}
    main form:not(.r){display:none!important}
    input,textarea,select{background:var(--bg-card);color:var(--text-main);border:1px solid var(--border-card);border-radius:8px}
    ::selection{background:rgba(249,115,22,.3)}
    @media (max-width:640px){nav .container{flex-wrap:wrap;padding:10px 16px 0;gap:8px}nav .container>div{order:1}#ah-theme{order:2;margin-left:auto}
    nav ul{order:3;width:100%;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;padding-bottom:8px!important;scrollbar-width:none}nav ul::-webkit-scrollbar{display:none}
    nav ul a{padding:6px 12px!important}nav{margin-bottom:40px!important}
    .f.changed{flex-direction:column;align-items:flex-start}article.graph::before{background-size:55% auto;opacity:.14}
    nav a.logo{font-size:1.15rem}.container{padding:0 16px}main>header::before{font-size:.75rem}}
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://apphivesl.com
    - title: Developers
      href: https://apphivesl.com/developers
    - title: Contact
      href: https://apphivesl.com/contact

i18n:
  up: Operational
  down: Down
  degraded: Degraded
  liveStatus: Live status
  allSystemsOperational: All systems operational
  rateLimitExceededTitle: Status temporarily unavailable
  rateLimitExceededIntro: "We couldn't load the latest status just now. Please try again in a few minutes. If you need help urgently, [contact us](https://apphivesl.com/contact)."
  rateLimitExceededWhatDoesErrorMean: " "
  rateLimitExceededErrorMeaning: " "
  rateLimitExceededErrorHowCanFix: " "
  rateLimitExceededErrorFix: " "
  rateLimitExceededGeneratePAT: " "
  footer: "© Apphive (SL) Limited · 14B Wilkinson Road, Freetown · [apphivesl.com](https://apphivesl.com) · [Contact](https://apphivesl.com/contact)"
